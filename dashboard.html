<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>더쿠 핫게 트렌드</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #ff4757;
    --accent2: #ffa502;
    --accent3: #2ed573;
    --text: #f0f0f0;
    --muted: #666;
    --card-radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 24px;
  }

  /* 헤더 */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .meta {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }

  .meta span { color: var(--accent2); }

  /* 상태 바 */
  .status-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-chip .label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'Space Mono', monospace;
  }

  .stat-chip .value {
    font-size: 22px;
    font-weight: 900;
    color: var(--text);
  }

  /* 그리드 */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  @media (max-width: 900px) {
    .grid, .grid-3 { grid-template-columns: 1fr; }
  }

  /* 카드 */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 20px;
  }

  .card-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '';
    display: inline-block;
    width: 3px; height: 12px;
    border-radius: 2px;
  }

  .card-title.red::before   { background: var(--accent); }
  .card-title.yellow::before { background: var(--accent2); }
  .card-title.green::before  { background: var(--accent3); }

  /* 워드 클라우드 */
  .word-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .word-tag {
    border-radius: 6px;
    padding: 4px 12px;
    cursor: default;
    transition: transform 0.15s, opacity 0.15s;
    white-space: nowrap;
  }

  .word-tag:hover { transform: scale(1.08); opacity: 0.85; }

  /* 바 차트 */
  .bar-list { display: flex; flex-direction: column; gap: 8px; }

  .bar-item { display: flex; flex-direction: column; gap: 4px; }

  .bar-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
  }

  .bar-word { color: var(--text); font-weight: 700; }
  .bar-count { color: var(--muted); font-family: 'Space Mono', monospace; }

  .bar-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  /* 게시글 리스트 */
  .post-list { display: flex; flex-direction: column; gap: 2px; }

  .post-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 10px;
    border-radius: 8px;
    transition: background 0.15s;
    text-decoration: none;
    color: inherit;
  }

  .post-item:hover { background: var(--surface2); }

  .post-rank {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    width: 18px;
    flex-shrink: 0;
  }

  .post-rank.top { color: var(--accent); font-weight: 700; }

  .post-title {
    font-size: 13px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .post-views {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    flex-shrink: 0;
  }

  /* 히스토리 차트 */
  .history-chart {
    width: 100%;
    height: 140px;
    position: relative;
  }

  .history-chart canvas { width: 100% !important; }

  /* 로딩 / 에러 */
  .loading {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }

  .error-msg {
    background: rgba(255,71,87,0.1);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 16px 20px;
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 20px;
  }

  /* 새로고침 버튼 */
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    padding: 6px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .refresh-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  /* 타임라인 */
  .timeline-scroll {
    overflow-x: auto;
    padding-bottom: 8px;
  }

  .timeline {
    display: flex;
    gap: 6px;
    min-width: max-content;
  }

  .timeline-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 48px;
  }

  .timeline-bar-wrap {
    height: 60px;
    display: flex;
    align-items: flex-end;
  }

  .timeline-bar {
    width: 28px;
    border-radius: 4px 4px 0 0;
    background: var(--accent);
    opacity: 0.7;
    transition: opacity 0.15s;
  }

  .timeline-bar:hover { opacity: 1; }

  .timeline-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    text-align: center;
  }

  .full-width { grid-column: 1 / -1; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <h1>더쿠 핫게 트렌드</h1>
  </div>
  <div class="meta">
    마지막 업데이트: <span id="last-update">--</span><br>
    수집 게시글: <span id="total-count">--</span>개
    <br><br>
    <button class="refresh-btn" onclick="loadData()">↻ 새로고침</button>
  </div>
</header>

<div id="error-area"></div>
<div id="main-content"><div class="loading">theqoo_data.json 로딩 중...</div></div>

<script>
// ── 색상 팔레트 ──────────────────────────────────────
const COLORS = [
  "#ff4757","#ffa502","#2ed573","#1e90ff","#a29bfe",
  "#fd79a8","#00cec9","#fdcb6e","#e17055","#74b9ff",
];

const BAR_COLORS = ["#ff4757","#ff6b81","#ffa502","#ffd32a","#2ed573"];

// ── 데이터 로드 ──────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch("theqoo_data.json?t=" + Date.now());
    if (!res.ok) throw new Error(`파일을 찾을 수 없어요 (${res.status})`);
    const data = await res.json();
    renderDashboard(data);
    document.getElementById("error-area").innerHTML = "";
  } catch (e) {
    document.getElementById("error-area").innerHTML =
      `<div class="error-msg">
        ⚠️ ${e.message}<br>
        <small>theqoo_crawler.py를 먼저 실행해서 theqoo_data.json을 생성해주세요.</small>
      </div>`;
    document.getElementById("main-content").innerHTML = "";
  }
}

// ── 렌더링 ───────────────────────────────────────────
function renderDashboard(data) {
  const latest = data.latest || {};
  const history = data.history || [];
  const topWords = latest.top_words || [];
  const topPosts = latest.top_posts || [];
  const allPosts = latest.all_posts || [];

  // 헤더 메타
  document.getElementById("last-update").textContent = latest.timestamp || "--";
  document.getElementById("total-count").textContent = latest.total || 0;

  // 상위 단어 Top5 (바 차트용)
  const top5 = topWords.slice(0, 5);
  const maxCount = top5[0]?.[1] || 1;

  // 워드클라우드 (top 30)
  const cloudWords = topWords.slice(0, 30);
  const maxCloudCount = cloudWords[0]?.[1] || 1;

  const wordCloudHTML = cloudWords.map(([word, count], i) => {
    const ratio = count / maxCloudCount;
    const size  = Math.round(12 + ratio * 20);
    const color = COLORS[i % COLORS.length];
    const opacity = 0.5 + ratio * 0.5;
    return `<span class="word-tag"
      style="font-size:${size}px;background:${color}22;color:${color};border:1px solid ${color}44;opacity:${opacity}"
      title="${count}회">${word}</span>`;
  }).join("");

  // 바 차트 Top10
  const top10 = topWords.slice(0, 10);
  const maxBar = top10[0]?.[1] || 1;
  const barHTML = top10.map(([word, count], i) => {
    const pct   = Math.round((count / maxBar) * 100);
    const color = BAR_COLORS[i % BAR_COLORS.length];
    return `
      <div class="bar-item">
        <div class="bar-meta">
          <span class="bar-word">${word}</span>
          <span class="bar-count">${count}회</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
      </div>`;
  }).join("");

  // 조회수 상위 게시글
  const postHTML = topPosts.slice(0, 10).map((p, i) => {
    const rankClass = i < 3 ? "post-rank top" : "post-rank";
    const views = Number(p.views || 0).toLocaleString();
    return `
      <a class="post-item" href="${p.link}" target="_blank" rel="noopener">
        <span class="${rankClass}">${String(i + 1).padStart(2, "0")}</span>
        <span class="post-title">${p.title}</span>
        <span class="post-views">${views}</span>
      </a>`;
  }).join("");

  // 히스토리 타임라인 (수집 횟수 추이)
  const timelineHTML = (() => {
    if (!history.length) return "<div style='color:var(--muted);font-size:12px'>아직 데이터 없음</div>";
    const recent = history.slice(-24);
    const maxTotal = Math.max(...recent.map(h => (h.top_words[0]?.[1] || 1)));
    return `<div class="timeline-scroll"><div class="timeline">` +
      recent.map(h => {
        const val  = h.top_words[0]?.[1] || 0;
        const pct  = Math.round((val / maxTotal) * 60);
        const time = h.timestamp.slice(11, 16);
        return `
          <div class="timeline-slot">
            <div class="timeline-bar-wrap">
              <div class="timeline-bar" style="height:${pct}px" title="${time} | 최빈어: ${h.top_words[0]?.[0]}(${val})"></div>
            </div>
            <span class="timeline-label">${time}</span>
          </div>`;
      }).join("") +
    `</div></div>`;
  })();

  // 통계 칩
  const uniqueWords = new Set(
    (latest.all_posts || []).flatMap(p => p.title.match(/[가-힣]{2,}/g) || [])
  ).size;

  document.getElementById("main-content").innerHTML = `
    <div class="status-bar">
      <div class="stat-chip">
        <span class="label">수집 게시글</span>
        <span class="value">${latest.total || 0}</span>
      </div>
      <div class="stat-chip">
        <span class="label">고유 단어</span>
        <span class="value">${uniqueWords}</span>
      </div>
      <div class="stat-chip">
        <span class="label">최빈 단어</span>
        <span class="value">${topWords[0]?.[0] || "--"}</span>
      </div>
      <div class="stat-chip">
        <span class="label">수집 횟수</span>
        <span class="value">${history.length}</span>
      </div>
    </div>

    <div class="grid">
      <div class="card" style="grid-column: 1 / -1">
        <div class="card-title red">Word Cloud — 상위 30 단어</div>
        <div class="word-cloud">${wordCloudHTML}</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-title yellow">Top 10 빈출 단어</div>
        <div class="bar-list">${barHTML}</div>
      </div>
      <div class="card">
        <div class="card-title green">조회수 Top 10 게시글</div>
        <div class="post-list">${postHTML}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title red">수집 히스토리 (최근 24회)</div>
      ${timelineHTML}
    </div>
  `;
}

// ── 자동 새로고침 (30분) ─────────────────────────────
loadData();
setInterval(loadData, 30 * 60 * 1000);
</script>
</body>
</html>
